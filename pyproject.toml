[project]
name = "griptape-nodes-sam3-library"
version = "0.1.0"
description = "Griptape Node Library for SAM3 (Segment Anything with Concepts)"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "griptape-nodes",
    "numpy",
    "Pillow",
]

[tool.uv.sources]
griptape-nodes = { git = "https://github.com/griptape-ai/griptape-nodes", rev="latest"}

[tool.hatch.build.targets.wheel]
packages = ["griptape_nodes_sam3_library"]


[project.optional-dependencies]
# Execution-time only: the engine installs these into <library>/.venv-exec and puts
# them on sys.path solely inside this library's worker process. They are absent from
# the machine that only edits workflows, which is the point.
exec = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
    "static_ffmpeg>=2.13.0",
    "opencv-python-headless>=4.11.0.86",
    # einops is imported at module scope on the model path; scikit-image backs
    # connected_components when triton is unavailable or the tensor is on CPU.
    "sam3 @ git+https://github.com/facebookresearch/sam3.git@967fdd651f71ca14949122fed4c918a778ca9334",
    "einops",
    "scikit-image",
    # Windows only: torch's Linux wheels already depend on a matching triton, and there is no
    # macOS wheel at any version. The <3.4 ceiling keeps it paired with torch 2.7 -- unpinned
    # resolved triton-windows 3.8, which tracks a much later torch.
    "triton-windows<3.4; sys_platform == 'win32'",
]
# The exec extra carries a git direct reference, which hatchling rejects by default.
[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright>=1.1.396", "pytest-asyncio>=0.21.0", "ruff>=0.8.0", "pytest"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*", "templates"]
pythonVersion = "3.12"
reportIncompatibleMethodOverride = false
reportMissingImports = false
reportMissingModuleSource = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportPossiblyUnboundVariable = false
